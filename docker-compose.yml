services:
  postgres:
    image: postgres:17
    container_name: mybank-postgres
    environment:
      POSTGRES_DB: mybank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - mybank-postgres-data:/var/lib/postgresql/data

volumes:
  mybank-postgres-data:
