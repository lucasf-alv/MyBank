databaseChangeLog:
  - changeSet:
      id: 005-create-table-transfer
      author: lucas
      changes:
        - createTable:
            tableName: transfer
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transfer
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(38,2)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: source_account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: destination_account_id
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: transfer
            baseColumnNames: source_account_id
            constraintName: fk_transfer_source_account
            referencedTableName: account
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: transfer
            baseColumnNames: destination_account_id
            constraintName: fk_transfer_destination_account
            referencedTableName: account
            referencedColumnNames: id

        - createIndex:
            tableName: transfer
            indexName: idx_transfer_source_account
            columns:
              - column:
                  name: source_account_id

        - createIndex:
            tableName: transfer
            indexName: idx_transfer_destination_account
            columns:
              - column:
                  name: destination_account_id