databaseChangeLog:
  - changeSet:
      id: 008-create-table-card
      author: lucas
      changes:
        - createTable:
            tableName: card
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_card
                    nullable: false

              - column:
                  name: number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: holder_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: expiration_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: account_id
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: card
            baseColumnNames: account_id
            constraintName: fk_card_account
            referencedTableName: account
            referencedColumnNames: id

        - createIndex:
            tableName: card
            indexName: idx_card_account_id
            columns:
              - column:
                  name: account_id

        - createIndex:
            tableName: card
            indexName: idx_card_account_status
            columns:
              - column:
                  name: account_id

              - column:
                  name: status