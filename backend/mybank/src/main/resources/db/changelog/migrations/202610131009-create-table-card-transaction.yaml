databaseChangeLog:
  - changeSet:
      id: 010-create-table-card-transaction
      author: lucas
      changes:
        - createTable:
            tableName: card_transaction
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_card_transaction
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(38,2)
                  constraints:
                    nullable: false

              - column:
                  name: merchant
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: card_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: invoice_id
                  type: UUID

        - addForeignKeyConstraint:
            baseTableName: card_transaction
            baseColumnNames: card_id
            constraintName: fk_card_transaction_card
            referencedTableName: card
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: card_transaction
            baseColumnNames: invoice_id
            constraintName: fk_card_transaction_invoice
            referencedTableName: credit_card_invoice
            referencedColumnNames: id

        - createIndex:
            tableName: card_transaction
            indexName: idx_card_transaction_card_id
            columns:
              - column:
                  name: card_id

        - createIndex:
            tableName: card_transaction
            indexName: idx_card_transaction_invoice_id
            columns:
              - column:
                  name: invoice_id