databaseChangeLog:
  - changeSet:
      id: 009-create-table-credit-card-invoice
      author: lucas
      changes:
        - createTable:
            tableName: credit_card_invoice
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credit_card_invoice
                    nullable: false

              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: closing_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: total_amount
                  type: NUMERIC(38,2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: card_id
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: credit_card_invoice
            baseColumnNames: card_id
            constraintName: fk_credit_card_invoice_card
            referencedTableName: card
            referencedColumnNames: id

        - createIndex:
            tableName: credit_card_invoice
            indexName: idx_invoice_card_id
            columns:
              - column:
                  name: card_id

        - createIndex:
            tableName: credit_card_invoice
            indexName: idx_invoice_card_status
            columns:
              - column:
                  name: card_id

              - column:
                  name: status