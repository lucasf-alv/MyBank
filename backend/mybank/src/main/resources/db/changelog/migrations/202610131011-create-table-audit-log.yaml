databaseChangeLog:
  - changeSet:
      id: 012-create-table-audit-log
      author: lucas
      changes:
        - createTable:
            tableName: audit_log
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_audit_log
                    nullable: false

              - column:
                  name: action
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: audit_log
            baseColumnNames: user_id
            constraintName: fk_audit_log_user
            referencedTableName: user
            referencedColumnNames: id

        - createIndex:
            tableName: audit_log
            indexName: idx_audit_log_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: audit_log
            indexName: idx_audit_log_action
            columns:
              - column:
                  name: action

        - createIndex:
            tableName: audit_log
            indexName: idx_audit_log_created_at
            columns:
              - column:
                  name: created_at