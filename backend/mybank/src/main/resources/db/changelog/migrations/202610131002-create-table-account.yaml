databaseChangeLog:
  - changeSet:
      id: 003-create-table-account
      author: lucas
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_account
                    nullable: false

              - column:
                  name: account_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: branch
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: balance
                  type: NUMERIC(38,2)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: account
            baseColumnNames: user_id
            constraintName: fk_account_user
            referencedTableName: user
            referencedColumnNames: id

        - createIndex:
            tableName: account
            indexName: idx_account_user_id
            columns:
              - column:
                  name: user_id