databaseChangeLog:
  - changeSet:
      id: 011-create-table-notification
      author: lucas
      changes:
        - createTable:
            tableName: notification
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_notification
                    nullable: false

              - column:
                  name: message
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: is_read
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: notification
            baseColumnNames: user_id
            constraintName: fk_notification_user
            referencedTableName: user
            referencedColumnNames: id

        - createIndex:
            tableName: notification
            indexName: idx_notification_user_id
            columns:
              - column:
                  name: user_id