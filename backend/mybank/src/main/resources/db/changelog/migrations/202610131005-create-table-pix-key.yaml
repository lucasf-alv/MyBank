databaseChangeLog:
  - changeSet:
      id: 006-create-table-pix-key
      author: lucas
      changes:
        - createTable:
            tableName: pix_key
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_pix_key
                    nullable: false

              - column:
                  name: key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: account_id
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: pix_key
            baseColumnNames: account_id
            constraintName: fk_pix_key_account
            referencedTableName: account
            referencedColumnNames: id

        - createIndex:
            tableName: pix_key
            indexName: idx_pix_key_account_id
            columns:
              - column:
                  name: account_id